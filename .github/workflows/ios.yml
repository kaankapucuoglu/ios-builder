# iOS derleyici (açık depo: GitHub'ın macOS dakikası açık depolarda ücretsiz).
# Uygulama kodu gizli depodan salt-okunur deploy key ile çekilir (açık depo için anahtar gerekmez: lifefit); bu depoda kod / imza / .ipa YOK.
# .ipa artifact olarak yüklenmez (açık depoda herkes indirebilirdi) → doğrudan App Store Connect'e gider.
# Başlat: gh workflow run ios.yml -R kaankapucuoglu/ios-builder -f app=mahalle-abisi   (ref boş → uygulamanın varsayılan dalı)
# 31.10.2026: Demir Tabur (yaratik-savasi) Apple dağıtımından çıkarıldı (4.3 ret) → seçenek, DEPLOY_KEY_YS ve PROFILE_YS kaldırıldı.
# 01.11.2026: lifefit (depo diyet-uygulamasi, dal main, AÇIK depo → deploy key yok) ve puzzlebee (depo jigsaw) eklendi.
# Gizli anahtarlar: EXPO_TOKEN, IOS_P12_BASE64, IOS_P12_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64,
#   DEPLOY_KEY_MA / DEPLOY_KEY_SL / DEPLOY_KEY_PO / DEPLOY_KEY_SB / DEPLOY_KEY_PB (ssh özel anahtar),
#   PROFILE_MA / PROFILE_SL / PROFILE_PO / PROFILE_SB / PROFILE_PB / PROFILE_LF (mobileprovision base64)
name: iOS

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Uygulama"
        type: choice
        options: [mahalle-abisi, sliplines, parkout, slipblocks, puzzlebee, lifefit]
        default: mahalle-abisi
      ref:
        description: "Dal / commit (boş = uygulamanın varsayılan dalı)"
        type: string
        default: ""
      upload:
        description: "App Store Connect'e yükle"
        type: boolean
        default: true
      runner:
        description: "macOS makinesi"
        type: string
        default: macos-26

permissions:
  contents: read

jobs:
  build:
    # yalnız depo sahibi başlatabilir (açık depo: başkasının tetiklemesi / fork'u gizli anahtarlara erişemez)
    if: github.actor == github.repository_owner
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Anahtar seç
        id: k
        # s: secret eki (PROFILE_<s>, DEPLOY_KEY_<s>) · repo: kaankapucuoglu/<repo> · ref: varsayılan dal
        run: |
          case "${{ inputs.app }}" in
            mahalle-abisi) echo "s=MA" >> $GITHUB_OUTPUT; echo "repo=mahalle-abisi" >> $GITHUB_OUTPUT; echo "ref=master" >> $GITHUB_OUTPUT ;;
            sliplines)     echo "s=SL" >> $GITHUB_OUTPUT; echo "repo=sliplines" >> $GITHUB_OUTPUT;     echo "ref=master" >> $GITHUB_OUTPUT ;;
            parkout)       echo "s=PO" >> $GITHUB_OUTPUT; echo "repo=parkout" >> $GITHUB_OUTPUT;       echo "ref=master" >> $GITHUB_OUTPUT ;;
            slipblocks)    echo "s=SB" >> $GITHUB_OUTPUT; echo "repo=slipblocks" >> $GITHUB_OUTPUT;    echo "ref=master" >> $GITHUB_OUTPUT ;;
            puzzlebee)     echo "s=PB" >> $GITHUB_OUTPUT; echo "repo=jigsaw" >> $GITHUB_OUTPUT;        echo "ref=master" >> $GITHUB_OUTPUT ;;
            lifefit)       echo "s=LF" >> $GITHUB_OUTPUT; echo "repo=diyet-uygulamasi" >> $GITHUB_OUTPUT; echo "ref=main" >> $GITHUB_OUTPUT ;;
            *) echo "Bu uygulama iOS derlemesine kapalı: ${{ inputs.app }}"; exit 1 ;;
          esac

      - uses: actions/checkout@v5
        with:
          repository: kaankapucuoglu/${{ steps.k.outputs.repo }}
          ref: ${{ inputs.ref || steps.k.outputs.ref }}
          # gizli depolar: deploy key; lifefit (açık depo) için boş → varsayılan GITHUB_TOKEN ile okunur
          ssh-key: ${{ steps.k.outputs.s == 'MA' && secrets.DEPLOY_KEY_MA || (steps.k.outputs.s == 'SL' && secrets.DEPLOY_KEY_SL || (steps.k.outputs.s == 'PO' && secrets.DEPLOY_KEY_PO || (steps.k.outputs.s == 'SB' && secrets.DEPLOY_KEY_SB || (steps.k.outputs.s == 'PB' && secrets.DEPLOY_KEY_PB || '')))) }}
          path: app
          persist-credentials: false

      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -z "$X" ]; then echo "Xcode 26 yok"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bağımlılıklar
        working-directory: app
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm i -g eas-cli@latest --loglevel=error

      - name: İmza dosyaları
        working-directory: app
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_P12_PASSWORD }}
          PROF: ${{ steps.k.outputs.s == 'MA' && secrets.PROFILE_MA || (steps.k.outputs.s == 'SL' && secrets.PROFILE_SL || (steps.k.outputs.s == 'PO' && secrets.PROFILE_PO || (steps.k.outputs.s == 'SB' && secrets.PROFILE_SB || (steps.k.outputs.s == 'PB' && secrets.PROFILE_PB || (steps.k.outputs.s == 'LF' && secrets.PROFILE_LF || ''))))) }}
        run: |
          [ -n "$PROF" ] || { echo "PROFILE_${{ steps.k.outputs.s }} secret'ı boş — mobileprovision base64 ekleyin"; exit 1; }
          mkdir -p ci-creds
          echo "$P12" | base64 --decode > ci-creds/dist.p12
          echo "$PROF" | base64 --decode > ci-creds/profile.mobileprovision
          node -e 'require("fs").writeFileSync("credentials.json", JSON.stringify({ios:{provisioningProfilePath:"ci-creds/profile.mobileprovision",distributionCertificate:{path:"ci-creds/dist.p12",password:process.env.P12_PASS}}}))'

      - name: Derle (eas build --local)
        working-directory: app
        run: eas build -p ios --profile production --local --non-interactive --output "$GITHUB_WORKSPACE/app.ipa"

      - name: App Store Connect'e yükle
        if: ${{ inputs.upload }}
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$P8" | base64 --decode > ~/private_keys/AuthKey_$KID.p8
          xcrun altool --upload-app -f "$GITHUB_WORKSPACE/app.ipa" -t ios --apiKey "$KID" --apiIssuer "$ISS"

      - name: Temizlik
        if: always()
        run: rm -rf app/ci-creds app/credentials.json ~/private_keys "$GITHUB_WORKSPACE/app.ipa"
